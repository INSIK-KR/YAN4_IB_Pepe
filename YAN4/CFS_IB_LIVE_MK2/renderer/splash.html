<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>CFS IB LIVE MK2_By Pepe</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2cb95 url("./splash-full.png") no-repeat 0 0 / 100% 100%;
      user-select: none;
      -webkit-app-region: drag;
    }
    /* 원본 1586×992 기준 막대 위치(두 그림 공통, 오른쪽 글씨 묶음 안). 출력은 50%. */
    .bar {
      position: absolute;
      left: 70.593%;
      top: 62.573%;
      width: 24.706%;
      height: 1.312%;
      overflow: hidden;
      border-radius: 999px;
    }
    .bar::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.85), transparent);
      animation: slide 1.1s linear infinite;
      will-change: transform;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(290%); }
    }
  </style>
</head>
<body>
  <div class="bar"></div>
  <script>
    // 로딩 그림 두 장 중 랜덤 (splash-full-2.png 는 make-splash.js 가 만듦)
    if (Math.random() < 0.5) {
      document.body.style.backgroundImage = 'url("./splash-full-2.png")';
    }
  </script>
</body>
</html>
