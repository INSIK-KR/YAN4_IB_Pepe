<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>CFS IB LIVE MK2_By Pepe</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4dcba url("./splash-full.png") no-repeat 0 0 / 100% 100%;
      user-select: none;
      -webkit-app-region: drag;
    }
    /* 원본 1586×992 막대(140,716 · 632×21)와 같은 비율. 출력은 50%. */
    .bar {
      position: absolute;
      left: 8.827%;
      top: 72.177%;
      width: 39.849%;
      height: 2.117%;
      overflow: hidden;
      border-radius: 999px;
    }
    .bar::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.85), transparent);
      animation: slide 1.1s linear infinite;
      will-change: transform;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(290%); }
    }
  </style>
</head>
<body>
  <div class="bar"></div>
</body>
</html>
