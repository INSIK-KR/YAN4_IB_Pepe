<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YNA4 IB 보충 현황</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      overflow-x: clip;
    }
    .container {
      width: 100%;
      max-width: min(1840px, calc(100vw - 32px));
      margin: 0 auto;
      padding: clamp(14px, 1.75vw, 24px) clamp(14px, 2vw, 28px) clamp(18px, 2.25vw, 30px);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      padding: 16px 18px;
      margin-bottom: 14px;
      border: 1px solid #e2e8f0;
    }
    .card-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
    }
    .card.card-upload {
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .card.card-upload .card-title {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .upload-shell {
      position: relative;
      width: 100%;
    }
    .upload-input-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .upload-zone {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 10px;
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 8px 12px;
      border: 2px dashed #93c5fd;
      border-radius: 10px;
      text-align: center;
      background: #f8fbff;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .upload-zone:hover,
    .upload-zone:focus-visible,
    .upload-zone.dragover {
      border-color: #2563eb;
      background: #eff6ff;
      outline: none;
    }
    .upload-zone.dragover { border-style: solid; }
    .upload-zone-secondary {
      border-color: #a5b4fc;
      background: #f8f7ff;
    }
    .upload-zone-secondary:hover,
    .upload-zone-secondary:focus-visible,
    .upload-zone-secondary.dragover {
      border-color: #6366f1;
      background: #eef2ff;
    }
    .upload-zone-tertiary {
      border-color: #7dd3fc;
      background: #f0f9ff;
    }
    .upload-zone-tertiary:hover,
    .upload-zone-tertiary:focus-visible,
    .upload-zone-tertiary.dragover {
      border-color: #0284c7;
      background: #e0f2fe;
    }
    .upload-zone-quaternary {
      border-color: #fcd34d;
      background: #fffbeb;
    }
    .upload-zone-quaternary:hover,
    .upload-zone-quaternary:focus-visible,
    .upload-zone-quaternary.dragover {
      border-color: #d97706;
      background: #fef3c7;
    }
    .upload-zone strong { color: #1d4ed8; }
    .upload-zone .upload-line {
      font-size: 13px;
      line-height: 1.35;
      color: #0f172a;
      max-width: 100%;
      margin: 0;
    }
    .upload-zone .upload-formats {
      font-size: 11px;
      color: #64748b;
      margin: 0;
    }
    .file-name {
      flex-basis: 100%;
      margin: 2px 0 0;
      min-height: 1.2em;
      font-size: 12px;
      color: #334155;
      word-break: break-all;
      max-width: 100%;
      text-align: center;
    }
    .upload-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px 12px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .upload-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .upload-col {
      min-width: 0;
    }
    .upload-col .upload-zone {
      flex-direction: column;
      gap: 2px;
    }
    .upload-col .sheet-strip {
      flex-direction: column;
      align-items: stretch;
    }
    .upload-col .sheet-strip select {
      min-width: 0;
      width: 100%;
      max-width: 100%;
    }
    .upload-label {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }
    .sheet-strip {
      display: none;
      align-items: center;
      gap: 6px 10px;
      flex-wrap: wrap;
      margin-top: 6px;
      padding: 6px 10px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .sheet-strip.is-visible { display: flex; }
    .sheet-strip label {
      font-weight: 700;
      font-size: 13px;
      color: #475569;
      margin: 0;
    }
    .sheet-strip select {
      margin-top: 0;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      min-width: 160px;
      background: #fff;
    }
    .load-summary {
      margin-top: 4px;
      font-size: 12px;
      color: #475569;
    }
    .load-summary.ok { color: #047857; font-weight: 700; }
    .load-summary.err { color: #b91c1c; font-weight: 700; }
    .upload-desc-block {
      margin-top: 10px;
      padding: 10px 12px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px dashed #cbd5e1;
      font-size: 13px;
      color: #64748b;
      line-height: 1.55;
    }
    textarea.paste-tsv {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      font-family: ui-monospace, Consolas, "Malgun Gothic", monospace;
      font-size: 12px;
      line-height: 1.45;
      background: #fff;
    }
    textarea.paste-tsv:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .paste-source-hint {
      margin: 0 0 10px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.45;
    }
    textarea.paste-source-grid {
      width: 100%;
      min-height: 52px;
      max-height: 100px;
      resize: vertical;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-family: ui-monospace, Consolas, "Malgun Gothic", monospace;
      font-size: 11px;
      line-height: 1.35;
      background: #fff;
    }
    textarea.paste-source-grid:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .paste-data-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(100px, 0.78fr);
      gap: 10px 14px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .paste-data-row {
        grid-template-columns: 1fr 1fr;
      }
      .paste-workflow-col {
        grid-column: 1 / -1;
      }
    }
    textarea.paste-tsv.paste-tsv-compact {
      min-height: 48px;
      max-height: 96px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.35;
      border-radius: 10px;
    }
    .paste-workflow-only-wrap {
      margin-top: 0;
    }
    .paste-workflow-only-wrap textarea.paste-tsv {
      width: 100%;
      box-sizing: border-box;
      min-height: 64px;
      max-height: 200px;
    }
    .yna4-excel-load-summary {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .yna4-excel-load-summary .load-summary {
      font-size: 11px;
    }
    #yna4DesktopFileBar.card.card-upload {
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    #yna4DesktopFileBar .card-title {
      margin: 0 0 6px;
      font-size: 14px;
    }
    .yna4-desktop-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .yna4-desktop-actions .btn-merge-teams-copy {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }
    .yna4-desktop-status {
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 1.35;
      color: #64748b;
      min-height: 1.25em;
    }
    .yna4-desktop-status.ok {
      color: #15803d;
    }
    .yna4-desktop-status.err {
      color: #b91c1c;
    }
    .yna4-excel-load-summary .load-summary:empty {
      display: none;
    }
    .merge-preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-bottom: 12px;
      padding-bottom: 2px;
      border-bottom: 1px solid #e2e8f0;
    }
    .merge-temp-filter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      margin-bottom: 0;
      font-size: 13px;
      color: #334155;
    }
    button.btn-merge-teams-copy {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
      background: #fff;
      font-family: inherit;
      white-space: nowrap;
    }
    button.btn-merge-teams-copy:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }
    .merge-teams-btn-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-right: 4px;
    }
    .merge-deadline-export-chips {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex: 1 1 180px;
      min-width: 0;
    }
    .merge-deadline-chips-label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      flex-shrink: 0;
    }
    .merge-deadline-chips-hint {
      font-size: 12px;
      color: #64748b;
    }
    .merge-deadline-chip--on {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
    }
    button.btn-merge-teams-copy.btn-merge-teams-copy--compact {
      padding: 6px 10px;
      font-size: 12px;
    }
    /* Electron 전용 · EGG·SR 왼쪽 (html.yna4-electron 일 때만 표시) */
    button.btn-merge-gloc-lookup {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      color: #1e3a5f;
      background: linear-gradient(180deg, #f0f9ff 0%, #dbeafe 100%);
    }
    html.yna4-electron button.btn-merge-gloc-lookup {
      display: inline-flex;
    }
    button.btn-merge-gloc-lookup:hover {
      background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 100%);
      border-color: #60a5fa;
      color: #0f172a;
    }
    button.btn-merge-gloc-lookup:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
    button.btn-merge-gloc-lookup:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .merge-temp-filter label { font-weight: 600; color: #0f172a; }
    .merge-temp-filter select {
      font: inherit;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #0f172a;
      min-width: 11rem;
      cursor: pointer;
    }
    .merge-temp-filter select:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 1px;
    }
    /* 구역별 표: 세로 스택 */
    .merge-dashboards-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .merge-dashboard-panel {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px 14px;
      background: #fff;
      scroll-margin-top: 12px;
      min-width: 0;
    }
    .merge-dashboard-panel-title {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.4;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }
    .merge-dashboard-panel-meta {
      margin: 0 0 10px;
      font-size: 12px;
      color: #64748b;
    }
    .merge-dashboard-panel .merge-table-wrap {
      max-height: min(520px, 55vh);
      width: 100%;
    }
    .merge-dashboard-panel--etc {
      padding: 8px 10px 10px;
    }
    .merge-dashboard-panel--etc .merge-dashboard-panel-title {
      font-size: 13px;
      padding-bottom: 4px;
      margin-bottom: 2px;
    }
    .merge-dashboard-panel--etc .merge-dashboard-panel-meta {
      font-size: 11px;
      margin-bottom: 6px;
    }
    .merge-dashboard-panel--etc .merge-table-wrap {
      max-height: min(240px, 32vh);
    }
    .merge-time-status-summary {
      margin: 0 0 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      padding: 10px 12px;
    }
    .merge-time-status-summary-title {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    .merge-time-status-summary-wrap {
      overflow: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
    }
    .merge-time-status-summary-table {
      width: 100%;
      min-width: 320px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .merge-time-status-summary-table th,
    .merge-time-status-summary-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
      white-space: nowrap;
    }
    .merge-time-status-summary-table th {
      background: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }
    .merge-time-status-summary-table td:first-child,
    .merge-time-status-summary-table th:first-child {
      text-align: left;
    }
    .merge-time-status-summary-table tbody tr:last-child td {
      border-bottom: 0;
      font-weight: 700;
      background: #f8fafc;
    }
    .merge-time-status-summary-table th.merge-time-status-summary-deadline,
    .merge-time-status-summary-table td.merge-time-status-summary-deadline {
      background: #dcfce7;
      color: #14532d;
    }
    .merge-time-status-summary-table tbody tr:last-child td.merge-time-status-summary-deadline {
      background: #bbf7d0;
    }
    .merge-table-wrap {
      overflow: auto;
      max-height: min(640px, 65vh);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
    }
    .merge-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      line-height: 1.35;
    }
    .merge-table th,
    .merge-table td {
      padding: 5px 8px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: middle;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .merge-table td.merge-cell-empty { color: #cbd5e1; }
    .merge-table td.merge-temp-rm { color: #475569; }
    .merge-table td.merge-cell-copy:not(.merge-cell-empty) { cursor: pointer; }
    .merge-table tbody tr:not(.merge-row-done) td.merge-cell-copy:not(.merge-cell-empty):hover {
      background-color: #e0f2fe;
      box-shadow: inset 0 0 0 1px #38bdf8;
    }
    .merge-table tbody tr.merge-row-done td.merge-cell-copy:not(.merge-cell-empty):hover {
      background-color: #4ade80;
      box-shadow: inset 0 0 0 1px #15803d;
    }
    @keyframes mergeCopyFlash {
      from { box-shadow: inset 0 0 0 999px rgba(56, 189, 248, 0.35); }
      to { box-shadow: none; }
    }
    @keyframes mergeCopyFlashDone {
      from { box-shadow: inset 0 0 0 999px rgba(21, 128, 61, 0.4); }
      to { box-shadow: none; }
    }
    .merge-table td.merge-cell-copied-flash { animation: mergeCopyFlash 0.45s ease; }
    .merge-table tbody tr.merge-row-done td.merge-cell-copied-flash { animation: mergeCopyFlashDone 0.45s ease; }
    .merge-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f1f5f9;
      font-weight: 700;
      color: #1e293b;
      box-shadow: 0 1px 0 #e2e8f0;
    }
    .merge-table tbody tr:nth-child(odd) { background-color: #fff; }
    .merge-table tbody tr:nth-child(even) { background-color: #f1f5f9; }
    .merge-table tbody tr:hover {
      background-color: #cbd5e1;
      transition: background-color 0.1s ease;
    }
    .merge-table tbody tr.merge-row-done,
    .merge-table tbody tr.merge-row-done:nth-child(odd),
    .merge-table tbody tr.merge-row-done:nth-child(even) { background-color: #86efac; }
    .merge-table tbody tr.merge-row-done:hover { background-color: #4ade80; }
    .merge-table th:nth-child(1),
    .merge-table td:nth-child(1) {
      box-sizing: border-box;
      width: 2%;
      min-width: min-content;
      max-width: max-content;
      padding: 5px 4px;
      text-align: left;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }
    .merge-table th:nth-child(3),
    .merge-table td:nth-child(3) {
      max-width: 3.75rem;
      width: 3.75rem;
      min-width: 3.75rem;
      padding-left: 2px;
      padding-right: 2px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .merge-table th:nth-child(4),
    .merge-table td:nth-child(4) {
      max-width: 3.5rem;
      width: 3.5rem;
      min-width: 3.5rem;
      padding-left: 2px;
      padding-right: 2px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .merge-table th:nth-child(2),
    .merge-table td:nth-child(2) {
      box-sizing: border-box;
      width: 2%;
      min-width: min-content;
      max-width: max-content;
      padding: 5px 4px;
      text-align: left;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }
    .merge-table th:nth-child(5),
    .merge-table td:nth-child(5),
    .merge-table th:nth-child(6),
    .merge-table td:nth-child(6) {
      box-sizing: border-box;
      width: 1%;
      min-width: min-content;
      max-width: max-content;
      padding: 5px 3px;
      text-align: left;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }
    .merge-table th:nth-child(7),
    .merge-table td:nth-child(7) {
      box-sizing: border-box;
      width: 1%;
      min-width: 12ch;
      max-width: none;
      padding: 5px 2px;
      text-align: left;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }
    .merge-table th:nth-child(8),
    .merge-table td:nth-child(8) {
      box-sizing: border-box;
      max-width: 5.5rem;
      width: 5.5rem;
      min-width: 4.75rem;
      padding: 5px 3px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .merge-table th:nth-child(9),
    .merge-table td:nth-child(9) {
      max-width: 4.75rem;
      width: 4.75rem;
      min-width: 4.5rem;
      padding-left: 5px;
      padding-right: 5px;
      text-align: center;
    }
    .merge-table th:nth-child(10),
    .merge-table td:nth-child(10),
    .merge-table th:nth-child(11),
    .merge-table td:nth-child(11),
    .merge-table th:nth-child(12),
    .merge-table td:nth-child(12),
    .merge-table th:nth-child(13),
    .merge-table td:nth-child(13) {
      box-sizing: border-box;
      width: 1%;
      min-width: min-content;
      max-width: max-content;
      padding: 5px 4px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }
    .merge-table th:nth-child(11),
    .merge-table td:nth-child(11) {
      max-width: 4.75rem;
      min-width: 3.75rem;
    }
    .merge-table th:nth-child(11),
    .merge-table td:nth-child(11),
    .merge-table th:nth-child(12),
    .merge-table td:nth-child(12),
    .merge-table th:nth-child(13),
    .merge-table td:nth-child(13) {
      padding: 4px 2px;
    }
    .merge-table th:nth-child(14),
    .merge-table td:nth-child(14) {
      box-sizing: border-box;
      width: 1%;
      min-width: min-content;
      max-width: max-content;
      padding: 4px 2px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }
    @media (max-width: 900px) {
      .container { max-width: 100%; padding: 14px 12px 20px; }
      .upload-row {
        grid-template-columns: 1fr;
      }
      .upload-col + .upload-col {
        margin-top: 4px;
        padding-top: 12px;
        border-top: 1px solid #e2e8f0;
      }
    }

    button.btn-merge-pdf-print {
      border: 1px solid #64748b;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #1e293b;
      background: #f8fafc;
      font-family: inherit;
      white-space: nowrap;
    }
    button.btn-merge-pdf-print:hover {
      background: #f1f5f9;
      border-color: #475569;
    }

    .yna4-print-doc-title {
      display: none;
    }

    #yna4MergePrintChunkHost {
      display: none;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 4mm;
      }
      html, body {
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .yna4-no-print {
        display: none !important;
      }
      .container {
        max-width: none !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .yna4-print-doc-title {
        display: none !important;
      }
      .yna4-printable-block .card {
        break-inside: auto;
        page-break-inside: auto;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin-bottom: 8px !important;
        padding: 6px 4px !important;
        border: 1px solid #cbd5e1 !important;
        border-top-width: 3px !important;
      }
      .yna4-printable-block .card-title {
        font-size: 9.5pt !important;
        margin: 0 0 4px !important;
      }
      .merge-preview-toolbar {
        display: none !important;
      }
      #yna4MergePrintChunkHost {
        display: block !important;
        box-sizing: border-box;
        padding: 0 1.5mm;
        max-width: 100%;
      }
      .yna4-merge-print-dash-block {
        margin-bottom: 0;
      }
      /* 인쇄만: ②번째 구역 블록부터 첫 인쇄 청크 앞에서 새 페이지 */
      .yna4-merge-print-dash-block:not(:first-child) > .yna4-merge-print-page-chunk:first-child {
        page-break-before: always !important;
        break-before: page !important;
      }
      #mergeDashboardsGrid.yna4-merge-hidden-for-print-pages {
        display: none !important;
      }
      .merge-table tr.yna4-merge-print-title-row td {
        width: auto !important;
        max-width: none !important;
        text-align: left !important;
        font-size: 8.75pt !important;
        font-weight: 700 !important;
        background: #e2e8f0 !important;
        white-space: normal !important;
        word-break: break-word !important;
        overflow-wrap: anywhere !important;
        overflow: visible !important;
        text-overflow: clip !important;
      }
      .yna4-merge-print-page-chunk {
        page-break-after: always;
        break-after: page;
      }
      .yna4-merge-print-page-chunk.yna4-merge-print-page-chunk--last-doc {
        page-break-after: auto;
        break-after: auto;
      }
      .merge-table-wrap {
        max-height: none !important;
        overflow: visible !important;
        border: 0 !important;
        border-radius: 0 !important;
      }
      /* 인쇄용 merge-table(청크) — 화면용 대시보드 표와 nth-child 규칙이 다름 */
      .merge-table {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        font-size: 7.75pt !important;
        line-height: 1.18 !important;
        border-collapse: collapse !important;
        table-layout: fixed !important;
      }
      .merge-table th,
      .merge-table td {
        white-space: normal !important;
        overflow: visible !important;
        text-overflow: clip !important;
        max-width: none !important;
        min-width: 0 !important;
        width: auto !important;
        padding: 1px 2px !important;
        word-break: break-word !important;
        overflow-wrap: anywhere !important;
        vertical-align: top !important;
        border-bottom: 1px solid #cbd5e1 !important;
      }
      .merge-table th {
        position: static !important;
        background: #e2e8f0 !important;
        font-weight: 700 !important;
        box-shadow: none !important;
      }
      .merge-table thead {
        display: none !important;
      }
      /* 인쇄 청크 12열: Barcode…보충기한(12숨김) — SKU·상차시간은 복제 시 제거 */
      .merge-table th:nth-child(12),
      .merge-table td:nth-child(12) {
        display: none !important;
      }
      .merge-table th:nth-child(1),
      .merge-table td:nth-child(1) {
        width: 11% !important;
        min-width: 12ch !important;
      }
      .merge-table th:nth-child(2),
      .merge-table td:nth-child(2) {
        width: 3% !important;
      }
      .merge-table th:nth-child(3),
      .merge-table td:nth-child(3) {
        width: 3% !important;
      }
      .merge-table th:nth-child(4),
      .merge-table td:nth-child(4) {
        width: 29% !important;
        padding: 2px 2px !important;
      }
      .merge-table th:nth-child(5),
      .merge-table td:nth-child(5) {
        width: 9% !important;
      }
      .merge-table th:nth-child(6),
      .merge-table td:nth-child(6) {
        width: 16% !important;
        min-width: 14ch !important;
      }
      .merge-table th:nth-child(7),
      .merge-table td:nth-child(7) {
        width: 6% !important;
        min-width: 4.25em !important;
      }
      .merge-table th:nth-child(8),
      .merge-table td:nth-child(8) {
        width: 4.2% !important;
      }
      .merge-table th:nth-child(9),
      .merge-table td:nth-child(9) {
        width: 5% !important;
      }
      .merge-table th:nth-child(10),
      .merge-table td:nth-child(10) {
        width: 6% !important;
        padding: 2px 1px !important;
      }
      .merge-table th:nth-child(11),
      .merge-table td:nth-child(11) {
        width: 4% !important;
        padding: 2px 1px !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      .merge-table tbody tr:not(.yna4-merge-print-title-row) td:not(:nth-child(4)) {
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        vertical-align: middle !important;
      }
      .merge-table thead tr,
      .merge-table tbody tr {
        height: 36pt !important;
      }
      .merge-table th,
      .merge-table td {
        height: 36pt !important;
        min-height: 36pt !important;
        max-height: 36pt !important;
        box-sizing: border-box !important;
      }
      .merge-table tbody td:nth-child(4) {
        vertical-align: middle !important;
        overflow: hidden !important;
      }
      .merge-table td.merge-cell-empty {
        color: transparent !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="yna4-no-print">YNA4 IB 보충 현황</h1>

    <div class="card card-upload yna4-no-print">
      <h2 class="card-title" id="yna4-paste-section-title">워크플로우</h2>
      <div class="paste-workflow-only-wrap">
        <textarea id="pasteTsv" class="paste-tsv paste-tsv-compact" rows="4" spellcheck="false" wrap="off" aria-labelledby="yna4-paste-section-title"></textarea>
      </div>
      <div class="yna4-excel-load-summary" aria-live="polite">
        <div class="load-summary" id="summary0"></div>
        <div class="load-summary" id="summary1"></div>
      </div>
    </div>

    <div class="card card-upload yna4-no-print" id="yna4DesktopFileBar" style="display: none">
      <h2 class="card-title">로컬 엑셀</h2>
      <div class="yna4-desktop-actions">
        <button type="button" class="btn-merge-teams-copy" id="yna4DesktopRefreshDisk">새로고침</button>
        <button type="button" class="btn-merge-teams-copy" id="yna4DesktopPickScanDir">폴더 선택…</button>
        <button type="button" class="btn-merge-teams-copy" id="yna4DesktopInventoryLogin" title="inventory.coupang.com 재고 목록을 열어 로그인합니다(쿠키는 persist:yna4-coupang-inventory). 이후 보충조회 API가 같은 세션으로 /async/inventory/search 를 호출합니다.">재고 로그인…</button>
      </div>
      <p class="yna4-desktop-status" id="yna4DesktopRefreshStatus" role="status" aria-live="polite"></p>
    </div>

    <div class="yna4-printable-block">
      <p class="yna4-print-doc-title">YNA4 IB 보충 현황</p>
      <div class="card card-merge-preview" id="yna4-preview-anchor">
        <div class="merge-preview-toolbar">
          <button
            type="button"
            class="btn-merge-gloc-lookup"
            id="yna4DesktopGlocLookup"
            title="통합표 GC(로케이션 바코드)로 inventory async/search 조회. result.content 가 비면 초록. EXE는 session.fetch+partition 쿠키(재고 로그인… 후 보충조회). lookupEngine=coupang_inventory_dom 은 DOM 방식. 완료 행·⑨·빈 GC 제외"
          >
            보충조회
          </button>
          <span class="merge-teams-btn-group" role="group" aria-label="구간별 표 복사(온도대)">
            <button type="button" class="btn-merge-teams-copy btn-merge-teams-copy--compact" id="btnCopyMergeTeamsChilled12" title="①② CHILLED 10·15구 · [SR] 표(HTML)+TSV 복사">EGG·SR</button>
            <button type="button" class="btn-merge-teams-copy btn-merge-teams-copy--compact" id="btnCopyMergeTeamsChilled3" title="③ CHILLED 20·25·30구 표(HTML)+TSV 복사">EGG20·30</button>
            <button type="button" class="btn-merge-teams-copy btn-merge-teams-copy--compact" id="btnCopyMergeTeamsChilled4" title="④ CHILLED 나머지 표(HTML)+TSV 복사">냉장</button>
            <button type="button" class="btn-merge-teams-copy btn-merge-teams-copy--compact" id="btnCopyMergeTeamsAmbient" title="⑤⑥ AMBIENT만 표(HTML)+TSV 복사">상온</button>
            <button type="button" class="btn-merge-teams-copy btn-merge-teams-copy--compact" id="btnCopyMergeTeamsFrozen" title="⑦ FROZEN만 표(HTML)+TSV 복사">냉동</button>
            <button type="button" class="btn-merge-teams-copy btn-merge-teams-copy--compact" id="btnCopyMergeTeamsRm" title="⑧ RM(GC 있음 · 온도대 미지정) 표(HTML)+TSV 복사">RM</button>
          </span>
          <div id="mergeDeadlineExportChips" class="merge-deadline-export-chips" role="group" aria-label="보충기한별 복사·인쇄 필터"></div>
          <button type="button" class="btn-merge-pdf-print" id="btnPrintMergePdf" title="보충지출력(PDF). 초록(완료) 행·GC 빈 행은 출력에서 제외. 데스크톱(EXE)은 PDF 저장 대화상자로 저장(webContents.printToPDF). 브라우저만 window.print() 인쇄 대화상자.">
            보충지출력(PDF)
          </button>
        </div>
        <section class="merge-time-status-summary yna4-no-print" aria-labelledby="mergeTimeStatusSummaryTitle">
          <h3 class="merge-time-status-summary-title" id="mergeTimeStatusSummaryTitle">온도대별 진열가능 보충건 (00:50·01:30 마감)</h3>
          <div class="merge-time-status-summary-wrap">
            <table class="merge-time-status-summary-table" id="mergeTimeStatusSummaryTable" aria-label="온도대별 진열가능 보충건 0:00 0:40 PREPACK">
              <thead id="mergeTimeStatusSummaryThead"></thead>
              <tbody id="mergeTimeStatusSummaryTbody"></tbody>
            </table>
          </div>
        </section>
        <div id="mergeDashboardsGrid" class="merge-dashboards-grid" role="region" aria-label="온도대별 보충 표 (9구역)">
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle1">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle1">① CHILLED — 10·15구 (프리팩)</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta1" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable1" aria-labelledby="mergeDashTitle1"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle2">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle2">② CHILLED — [SR]</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta2" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable2" aria-labelledby="mergeDashTitle2"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle3">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle3">③ CHILLED — 20·25·30구 (반숙·반숙란 제외)</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta3" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable3" aria-labelledby="mergeDashTitle3"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle4">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle4">④ CHILLED — ①②③ 제외 나머지</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta4" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable4" aria-labelledby="mergeDashTitle4"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle5">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle5">⑤ AMBIENT — 프리팩</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta5" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable5" aria-labelledby="mergeDashTitle5"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle6">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle6">⑥ AMBIENT</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta6" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable6" aria-labelledby="mergeDashTitle6"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle7">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle7">⑦ FROZEN</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta7" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable7" aria-labelledby="mergeDashTitle7"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel" aria-labelledby="mergeDashTitle8">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle8">⑧ RM</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta8" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable8" aria-labelledby="mergeDashTitle8"></table>
            </div>
          </section>
          <section class="merge-dashboard-panel merge-dashboard-panel--etc" aria-labelledby="mergeDashTitle9">
            <h3 class="merge-dashboard-panel-title" id="mergeDashTitle9">⑨ GC 없음 · RCRT1</h3>
            <p class="merge-dashboard-panel-meta yna4-no-print" id="mergeDashMeta9" aria-live="polite"></p>
            <div class="merge-table-wrap">
              <table class="merge-table" id="mergePreviewTable9" aria-labelledby="mergeDashTitle9"></table>
            </div>
          </section>
        </div>
      </div>

    </div>
  </div>

<script>window.YNA4_PAGE_ROLE = "combined";</script>
<script src="yna4-replenish-core.js?v=91"></script>
