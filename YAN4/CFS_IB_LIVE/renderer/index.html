<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CFS IB LIVE_By Pepe</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #e2e8f0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    }
    @media print {
      html, body {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
    }
    #banner {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 6px 10px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
      flex-shrink: 0;
      z-index: 2147483647;
      position: relative;
    }
    #banner strong { color: #fbbf24; }
    /* 글자가 길어도 상단바가 2줄로 늘어나지 않게 남는 폭 안에서 자름 */
    /* 페이지 버튼은 shell.js 가 상태 글자 뒤에 끼워 넣어서 순서로 제목 옆에 둠 */
    #banner .yna4-shell-page-nav { order: 1; }
    #banner .login-group { order: 3; }
    #sessStatus {
      order: 2;
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #banner .ok { color: #86efac; }
    #banner .bad { color: #fca5a5; }
    #banner .hint { color: #94a3b8; }
    #banner .login-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    #banner .yna4-shell-page-nav {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 4px;
    }
    #banner .yna4-shell-page-nav button {
      width: 28px;
      height: 24px;
      min-width: 28px;
      padding: 0;
      border: 1px solid #475569;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
      box-sizing: border-box;
    }
    #banner .yna4-shell-page-nav button.is-active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }
    #banner .yna4-shell-page-nav button.yna4-shell-page-nav--sla {
      min-width: 34px;
      width: auto;
      padding: 0 6px;
      font-size: 10px;
      letter-spacing: 0.02em;
      border-color: #6366f1;
      background: #312e81;
      color: #c7d2fe;
    }
    #banner .yna4-shell-page-nav button.yna4-shell-page-nav--sla.is-active {
      background: #4f46e5;
      border-color: #818cf8;
      color: #fff;
    }
    #banner .yna4-shell-page-nav button.yna4-shell-page-nav--ats {
      min-width: 34px;
      width: auto;
      padding: 0 6px;
      font-size: 10px;
      letter-spacing: 0.02em;
      border-color: #f87171;
      background: #7f1d1d;
      color: #fecaca;
    }
    #banner .yna4-shell-page-nav button.yna4-shell-page-nav--ats.is-active {
      background: #dc2626;
      border-color: #f87171;
      color: #fff;
    }
    #banner .login-group button {
      border: 0;
      border-radius: 4px;
      padding: 4px 10px;
      font-weight: 600;
      cursor: pointer;
      min-width: 76px;
      box-sizing: border-box;
      text-align: center;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1.2;
    }
    #banner .login-group button:disabled { opacity: 0.6; }
    #banner .login-group button.is-busy,
    #banner .login-group button.is-ok {
      font-size: 11px;
      letter-spacing: -0.03em;
    }
    #banner .login-group button.is-ok {
      box-shadow: inset 0 0 0 1px #16a34a;
    }
    #banner .center-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: 6px;
      padding-right: 8px;
      border-right: 1px solid #334155;
    }
    #banner .center-group select {
      height: 24px;
      border: 1px solid #475569;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      padding: 0 4px;
    }
    #banner .center-group button {
      min-width: 48px;
      background: #38bdf8;
      color: #0f172a;
    }
    #centerStatus { font-weight: 600; white-space: nowrap; }
    #btnLoginCoupang { background: #fbbf24; color: #0f172a; }
    #btnLoginPo { background: #a78bfa; color: #0f172a; }
    #btnLoginMos { background: #2dd4bf; color: #0f172a; }
    #btnLoginShipments { background: #60a5fa; color: #0f172a; }
    #banner .login-group button#btnOpenSop {
      background: #fb923c;
      color: #0f172a;
      min-width: 0;
      width: auto;
      height: auto;
      padding: 4px 8px;
      border: 0;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0;
    }
    #banner .login-group button#btnOpenSop:hover {
      background: #f97316;
      color: #0f172a;
    }
    #sopSearchBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      background: rgba(15, 23, 42, 0.55);
      align-items: flex-start;
      justify-content: center;
      padding: 72px 16px 16px;
      box-sizing: border-box;
    }
    #sopSearchBackdrop.is-open { display: flex; }
    #sopSearchBackdrop .sop-search-card {
      width: min(420px, 94vw);
      background: #fff;
      border-radius: 10px;
      padding: 16px 16px 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      border: 1px solid #e2e8f0;
    }
    #sopSearchBackdrop .sop-search-title {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 10px;
    }
    #sopSearchBackdrop .sop-search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #sopSearchBackdrop #sopSearchInput {
      flex: 1;
      height: 34px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 10px;
      font: 13px/1.2 "Segoe UI", "Malgun Gothic", sans-serif;
    }
    #sopSearchBackdrop #sopSearchInput:focus {
      outline: none;
      border-color: #fb923c;
    }
    #sopSearchBackdrop .sop-search-go {
      height: 34px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      background: #fb923c;
      color: #0f172a;
      font-weight: 800;
      cursor: pointer;
    }
    #sopSearchBackdrop .sop-search-hint {
      margin: 8px 0 0;
      font-size: 11px;
      color: #64748b;
    }
    #sopSearchBackdrop .sop-search-close {
      margin-top: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    #shellMount {
      position: absolute;
      inset: 36px 0 0 0;
      overflow: hidden;
      background: #f1f5f9;
    }
    #shellMount #yna4UnifiedUiShell_v09 {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: auto !important;
      max-width: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <div id="banner">
    <strong>CFS IB LIVE</strong>
    <span id="sessStatus" class="hint" aria-live="polite"></span>
    <span class="login-group">
      <span class="center-group">
        <span id="centerStatus" class="hint">센터: —</span>
        <select id="centerSelect" title="전환할 센터"></select>
        <button type="button" id="btnCenterSwitch" title="inbound 세션 센터 전환">전환</button>
      </span>
      <button type="button" id="btnLoginCoupang" title="WMS · inventory/inbound/outbound 세션">WMS</button>
      <button type="button" id="btnLoginPo" title="PO Management 세션">PO</button>
      <button type="button" id="btnLoginMos" title="MOS · Gross HTP / Need help">MOS</button>
      <button type="button" id="btnLoginShipments" title="SHPT · 쉽먼트 입차예약시간">SHPT</button>
      <button type="button" id="btnOpenSop" title="입고 매뉴얼 (SOP)" aria-label="입고 매뉴얼">?</button>
    </span>
  </div>
  <div id="shellMount"></div>

  <script src="./desktop-shim.js"></script>
  <script src="./vendor/chart.umd.min.js"></script>
  <script src="./vendor/xlsx.full.min.js"></script>
  <script src="./vendor/JsBarcode.all.min.js"></script>
  <script src="./vendor/qrcode.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script src="./vendor/gm-bridge.js"></script>
  <script src="./vendor/yan4-sla-page.js"></script>
  <script src="./vendor/yan4-ats-page.js"></script>
  <script src="./vendor/yan4-stow-error-page.js"></script>
  <script src="./vendor/yan4-rcrt-label-print.js"></script>
  <script src="./vendor/yan4-bipyo-label-print.js"></script>
  <script src="./vendor/yan4-location-consolidation-page.js"></script>
  <script src="./vendor/yan4-damage-verify-page.js"></script>
  <script src="./vendor/yan4-avail-history-page.js"></script>
  <script src="./vendor/shell.js"></script>
  <script src="./vendor/yan4-tutorial.js"></script>
  <script src="./boot.js"></script>
</body>
</html>
